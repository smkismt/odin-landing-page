<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Odin Landing Page</title>
  </head>
  <body>
    <header class="header">
      <a class="header__logo" href="#">Header Logo</a>
      <nav class="navigation">
        <ul class="navigation__list">
          <li><a class="navigation__link" href="#">header link one</a></li>
          <li><a class="navigation__link" href="#">header link two</a></li>
          <li><a class="navigation__link" href="#">header link three</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="container hero">
        <div class="hero__content">
          <h1 class="hero__title">This website is awesome</h1>
          <p class="hero__lead">
            This website has some subtext that goes here under the main title.
            It's a smaller font and the colors is lower contrast
          </p>
          <button class="button button--primary" type="submit">Sign up</button>
        </div>
        <img
          class="hero__image"
          src="https://picsum.photos/500/200"
          alt="random images"
        />
      </section>
    </main>
  </body>
</html>
